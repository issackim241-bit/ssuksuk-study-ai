/* ===== 가독성 및 실제 서비스형 화면 보정 ===== */
body {
  line-height: 1.65;
}
header {
  max-width: 800px;

}

  letter-spacing: -0.6px;
}

  max-width: 200px;
  padding: 10px 8px 9px;

.pet {

.bar {

.bar i {
  background: var(--ac);

.wk .on i {

.chip,

  background: var(--ac);

.chip2 {

  border: 1px solid var(--bd);
}
.msg.u .bub {
  background: var(--ac);

a {
  text-underline-offset: 3px;
}
:focus-visible {
  outline-color: var(--sun);
}
@media (min-width: 760px) {
  body {
    font-size: 15.5px;

  main {
    padding-top: 12px;

  }
  .card {
    border-radius: 18px;
    margin-bottom: 16px;
  }
  .hero {
    padding: 26px 26px 24px;
  }
}
@media (max-width: 420px) {
  header {
    padding: 12px 14px;
  }
  main {
    padding-left: 12px;
    padding-right: 12px;
  }
  .card {
    padding: 15px;
  }
  .row {
    gap: 6px;
  }
  .row > * {
    min-width: 0;
  }
  .hero h1 {
    font-size: 23px;
  }
  .big {
    font-size: 44px;
  }
}

 저장: localStorage(sg_u 전체 유저, sg_c 로그인 중인 이름), 현재 유저 데이터는 D

 AI 도우미 탭: aiPage / aiSend / histHTML (대화 기록은 D.chats), 로비의 AI 브리핑: brief / follow

let SUB = null,
  GOAL = 0,
  AC = null,
  al = null,
  RK = [],
  dbR = null,
  myId = null,
  hb = 0;
const SN = {
  알람: { w: "square", f: [1000, 1000, 1000, 1000], d: 0.1, g: 0.15 },
  벨: { w: "sine", f: [880, 660, 880, 660], d: 0.35, g: 0.35 },
  차임: { w: "triangle", f: [523, 659, 784, 1047], d: 0.45, g: 0.3 },
};
const sn = () => (SN[D.snd] ? D.snd : "알람");
const dayS = () => {
  if (!D.day || D.day.d !== today()) D.day = { d: today(), s: 0 };
  return D.day.s;
};
const elapsed = () =>
  D && D.run ? Math.floor((Date.now() - D.run.t) / 1000) : 0;
function unlock() {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    AC.resume();
  } catch (e) {}
}
function ringOnce() {
  if (!AC) return;
  const k = SN[sn()],
    t0 = AC.currentTime;
  k.f.forEach((f, i) => {
    const o = AC.createOscillator(),
      g = AC.createGain(),
      t = t0 + i * (k.d + 0.08);
    o.type = k.w;
    o.frequency.value = f;
    g.gain.setValueAtTime(k.g, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + k.d);
    o.connect(g);
    g.connect(AC.destination);
    o.start(t);
    o.stop(t + k.d + 0.02);
  });
}
function ring() {
  D.run.al = 1;
  save();
  unlock();
  ringOnce();
  clearInterval(al);
  al = setInterval(ringOnce, 2000);
  try {
    navigator.vibrate && navigator.vibrate([300, 150, 300]);
  } catch (e) {}
  render();
}
function stopRing() {
  clearInterval(al);
  al = null;
}
function tick() {
  const el = $("#tm");
  if (!D || !D.run) return;
  const e = elapsed();
  if (el) el.textContent = fmt(e);
  const t = $("#td2");
  if (t) t.textContent = "오늘 " + fmt(dayS() + e);
  if (D.run.g && e >= D.run.g * 60 && !D.run.al) ring();
}
function startT() {
  unlock();
  D.run = { s: SUB || D.subs[0], t: Date.now(), g: GOAL };
  dayS();
  save();
  sync(1);
  render();
}
function stopT() {
  if (!D.run) return;
  const sec = elapsed();
  D.logs[D.run.s] = (D.logs[D.run.s] || 0) + sec;
  dayS();
  D.day.s += sec;
  D.pts += Math.floor(sec / 60);
  D.run = null;
  stopRing();
  save();
  sync(0);
}
function sync(run) {
  if (!dbR || !myId || !D) return;
  dbR
    .doc("rank/" + myId)
    .set({
      name: cur,
      d: today(),
      s: dayS() + (run ? elapsed() : 0),
      run: run ? 1 : 0,
      sub: D.run ? D.run.s : "",
      at: Date.now(),
    })
    .catch(() => {});
}
function rkHTML() {
  if (!dbR)
    return '<p class="mu" style="margin:0">랭킹은 로그인한 상태로 공유 링크에서 열면 켜져요.</p>';
  const n = Date.now(),
    L = RK.filter((r) => r.d === today())
      .map((r) => {
        const lv = r.run && n - r.at < 150000;
        return { ...r, lv, t: Math.floor(r.s + (lv ? (n - r.at) / 1000 : 0)) };
      })
      .sort((a, b) => b.t - a.t)
      .slice(0, 20);
  if (!L.length)
    return '<p class="mu" style="margin:0">오늘 공부한 사람이 아직 없어요. 첫 번째가 되어 보세요.</p>';
  return L.map(
    (r, i) =>
      `<div class="rk ${r.id == myId ? "me" : ""}"><b>${i + 1}</b><span class="nm">${esc(r.name)}${r.lv ? `<em>${esc(r.sub)} 공부 중</em>` : ""}</span><span class="tt">${fmt(r.t)}</span></div>`,
  ).join("");
}
async function initDb() {

async function aiSend(t) {
  const el = $("#cq");
  t = (t || (el ? el.value : "")).trim();
  if (!t || AI.busy) return;
  const engine = aiSet().eng || "api";
  const sm = engine === "claude" ? await getSample() : null;
  let c = curChat();
  if (!c) {
    c = { id: Date.now(), t: t.slice(0, 24), ts: Date.now(), m: [] };
    chats().unshift(c);
    if (D.chats.length > 30) D.chats.length = 30;
    AI.cur = c.id;
  }
  c.m.push({ r: "u", c: t });
  const a = { r: "a", c: "" };
  c.m.push(a);
  c.ts = Date.now();
  if (c.m.length > 60) c.m.splice(0, 2);

  if (engine === "local") {
    a.c = kbAnswer(t, aiSet().study);
    save(); render();
    window.scrollTo(0, document.body.scrollHeight);
    return;
  }

  AI.busy = 1;
  AI.ctl = new AbortController();
  render();
  window.scrollTo(0, document.body.scrollHeight);
  const settings = aiSet();
  const turns = c.m.slice(0, -1).slice(-16).map((x) => ({
    role: x.r === "u" ? "user" : "assistant",
    content: String(x.c || "").slice(0, 3000),
  }));
  try {
    if (engine === "api") {
      if (location.protocol === "file:") throw new Error("HTML 미리보기에서는 내장 답변을 선택해 주세요. 실제 AI는 Render 주소나 http://localhost:3000에서 사용할 수 있어요.");
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        signal: AI.ctl.signal,
        body: JSON.stringify({
          messages: turns,
          studyMode: !!settings.study,
          profile: {
            traits: D.traits || {},
            tests: D.tests || {},
            exam: D.exam || {},
            subjects: D.subs || [],
            studyLogs: D.logs || {},
            plan: (D.plan || []).map((p) => ({ task: p.t, done: !!p.d })),
            analysis: D.sum || "",
            report: D.report || "",
          },
        }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || (response.status === 404 ? "AI 서버를 찾을 수 없어요. Render에서 Static Site 대신 Web Service로 배포해 주세요." : `서버 오류 (${response.status})`));
      a.c = data.reply || "답변을 받지 못했어요. 다시 시도해 주세요.";
    } else if (engine === "claude" && sm) {
      await sm(
        [
          { role: "user", content: settings.study ? AIS.study : AIS.free },
          { role: "assistant", content: "네, 알겠어요." },
          ...turns,
        ],
        {
          signal: AI.ctl.signal,
          modelTier: settings.tier,
          cache: false,
          onText: (x) => { a.c = x.text; paintChat(); },
        },
      );
      if (!a.c) a.c = "답변을 받지 못했어요. 다시 시도해 주세요.";
    } else {
      throw new Error("Claude 연결은 공유 환경에서만 사용할 수 있어요. OpenAI API를 쓰려면 서버를 실행해 주세요.");
    }
  } catch (e) {
    if (e && e.name === "AbortError") a.c = "(응답을 중지했어요)";
    else a.c = "AI 연결에 실패했어요. " + (e && e.message ? e.message : "서버 실행 상태와 API 설정을 확인해 주세요.");
  }
  AI.busy = 0;
  AI.ctl = null;
  save();
  if (tab === "ai" && AI.v === "chat") render();

    ["지표면 중력가속도", "약 9.8 m/s²"],
    ["산성 용액의 pH", "7보다 작다"],

    ["지구 자전 주기와 공전 주기", "자전 약 24시간, 공전 약 365일"],
    ["태양계에서 가장 큰 행성", "목성"],
    ["유전 정보를 담고 있는 물질", "DNA"],
    ["빛의 속력", "약 30만 km/s"],
    ["식물 세포에만 있는 구조", "세포벽, 엽록체"],
  ],
  수학: [
    ["피타고라스 정리", "a² + b² = c²"],
    ["원의 넓이와 둘레", "넓이 πr², 둘레 2πr"],
    ["삼각형의 넓이", "밑변 × 높이 ÷ 2"],

};
function gameMenu() {
  const n = Object.values(DECKS).reduce((a, b) => a + b.length, 0),
    rows = [
      [
        "암산 기본",
        "덧셈·뺄셈·곱셈·나눗셈·거듭제곱·제곱근·수열 10문제",
        "startMath(1)",
      ],
      ["암산 도전", "숫자가 커지고 수열도 어려워져요 · 10문제", "startMath(2)"],
      ["역사 퀴즈", `한국사 ${HQ.length}문제 중 10문제`, "startHist()"],
      [
        "암기 카드",
        `한국사·영단어·과학·수학 ${n}장 + 내 카드`,
        "G={m:'card',i:0,f:0};render()",
      ],
      [
        "오답노트",
        `틀린 문제 ${(D.wr || []).length}개 다시 보기`,
        "G={m:'wrong'};render()",
      ],
    ];
  return `<div class="card"><h3>미니게임</h3><p class="mu" style="margin:4px 0 0">정답 하나에 3P, 카드 복습은 2P예요.</p></div><div class="card" style="padding:4px 18px">${rows.map((r, i) => `<button class="lk" style="width:100%;background:none;border-radius:0;padding:14px 0;text-align:left;color:var(--tx);font-weight:400;${i ? "" : "border-top:0"}" onclick="${r[2]}"><span><b>${r[0]}</b><small>${r[1]}</small></span>${svg("chev", 18)}</button>`).join("")}</div>`;
}
function startHist() {
  G = { m: "hist", i: 0, sc: 0, n: 10, qs: shuf(HQ).slice(0, 10), fb: "" };
  render();
}
function gHist() {
  if (G.i >= G.n) return result();
  const q = G.qs[G.i];
  return `<div class="card"><p class="mu">${G.i + 1} / ${G.n} ${G.fb}</p><h3 style="margin-bottom:12px">${q[0]}</h3>${shuf(
    q.slice(1),
  )
    .map(
      (o) =>
        `<button class="opt" data-o="${esc(o)}" onclick="chkH(this.dataset.o)">${esc(o)}</button>`,
    )
    .join("")}</div>`;
}
function chkH(o) {
  const ok = o === G.qs[G.i][1];
  if (ok) {
    G.sc++;
    add(3);
  } else addWrong("역사", G.qs[G.i][0], G.qs[G.i][1], o);
  G.fb = ok
    ? "· 지난 문제 정답 ⭕"
    : "· 지난 문제 오답 ❌ (정답 " + G.qs[G.i][1] + ")";
  G.i++;
  render();
}
function gCard() {
  const mine = !G.dk || G.dk == "내 카드",
    c = mine ? D.cards : DECKS[G.dk];
  const form = `<div class="card"><h3>카드 만들기</h3><input id="cf" placeholder="앞면 (질문)"><input id="cb" placeholder="뒷면 (답)"><button class="w" onclick="addCard()">카드 추가</button></div>`;
  const back = `<button class="s" onclick="G={m:''};render()" style="margin-bottom:10px">← 게임 목록</button>`;
  const dk = `<div class="chips" style="justify-content:flex-start;margin:0 0 12px">${["내 카드", ...Object.keys(DECKS)].map((n) => `<button class="chip2 ${(G.dk || "내 카드") == n ? "on" : ""}" onclick="G.dk='${n}';G.i=0;G.f=0;render()">${n}</button>`).join("")}</div>`,
    frm = mine ? form : "";
  if (!c.length)
    return (
      back +
      dk +
      (mine
        ? `<p class="mu">아직 만든 카드가 없어요. 아래에서 추가해 보세요.</p>`
        : "") +
      frm
    );
  const k = G.i % c.length;
  return (
    back +
    dk +
    `<div class="card"><p class="mu">${k + 1} / ${c.length}</p><div class="flip" onclick="G.f=!G.f;render()">${esc(G.f ? c[k].b : c[k].f)}</div><p class="mu" style="text-align:center">${G.f ? "답을 확인했어요" : "카드를 눌러 답 보기"}</p><div class="row"><button class="s" onclick="G.i++;G.f=0;render()">몰라요</button><button onclick="add(2);G.i++;G.f=0;render()">알아요 +2P</button></div>${mine ? `<button class="s" style="margin-top:10px" onclick="delCard(${k})">이 카드 삭제</button>` : ""}</div>` +
    frm
  );
}
function addCard() {
  const f = $("#cf").value.trim(),
    b = $("#cb").value.trim();
  if (f && b) {
    D.cards.push({ f, b });
    save();
    render();
  }
}
function delCard(k) {
  D.cards.splice(k, 1);
  G.f = 0;
  save();
  render();
}
render();
initDb();

/* ===== JavaScript 기능 끝 ===== */
    </script>
  </body>
